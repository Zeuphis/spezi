name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build Spezi.sln -c Release
      - name: Unit tests (hardware-free)
        run: dotnet test tests/Spezi.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/Spezi.Tests/TestResults
# The encoder/audio regression suite (tests/Spezi.RecordingTests.csproj) needs a
# GPU encoder and audio devices and is run locally, not on hosted runners.
